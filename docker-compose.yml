services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    ports:
      - "29092:9092"
    hostname: kafka
  kafka-init:
    image: apache/kafka:3.8.1
    container_name: kafka-init
    depends_on:
      - kafka
    environment:
      BOOTSTRAP_SERVER: kafka:9092
    tty: true
#    command: "/bin/sh /opt/kafka/bin/kafka-topics.sh --create --topic demo-topic --bootstrap-server kafka:9092"